[package]
name = "tracematter"
version = "0.1.0"
description = "Agent trajectory workbench - inspect runs, curate training data"
authors = ["TraceMatter Contributors"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# The record layer only: enough to read a file and hand back untyped values,
# without pulling in the whole arrow compute stack. Compression features are
# listed explicitly because default-features is off.
parquet = { version = "54", default-features = false, features = [
  "snap", "brotli", "flate2", "lz4", "zstd",
] }

serde = { version = "1", features = ["derive"] }
# preserve_order keeps a JSON object's key order through a parse/serialise round
# trip. Without it serde_json::Map is a BTreeMap and every edited line would come
# back with its keys alphabetised -- a rewrite the user never asked for.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
futures = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
